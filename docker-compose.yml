x-application: &application
  build: .
  environment: &application-environment
    PGHOST: db
    PGPORT: 5432
    PGDATABASE: ${POSTGRES_DB:-pawops}
    PGUSER: ${POSTGRES_USER:-pawops}
    PGPASSWORD: ${POSTGRES_PASSWORD:-pawops_dev_password}
    APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
    DUPLICATE_WINDOW_MINUTES: ${DUPLICATE_WINDOW_MINUTES:-30}
    OVERDUE_GRACE_MINUTES: ${OVERDUE_GRACE_MINUTES:-15}
    RABBITMQ_URL: amqp://pawops:${RABBITMQ_PASSWORD:-pawops_rabbit_dev_password}@rabbitmq:5672
    ALERT_RETRY_DELAY_MS: ${ALERT_RETRY_DELAY_MS:-60000}
    ALERT_MAX_ATTEMPTS: ${ALERT_MAX_ATTEMPTS:-5}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pawops}
      POSTGRES_USER: ${POSTGRES_USER:-pawops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawops_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *application
    command: ["node", "server/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pawops
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pawops_rabbit_dev_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    <<: *application
    restart: unless-stopped
    environment:
      <<: *application-environment
      # Local HTTP only; set true when serving through an HTTPS reverse proxy.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  alert-worker:
    <<: *application
    restart: unless-stopped
    command: ["node", "server/jobs/alert-worker.js"]
    environment:
      <<: *application-environment
      WORKER_HEARTBEAT_FILE: /tmp/pawops-alert-heartbeat
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');try{process.exit(Date.now()-Number(fs.readFileSync('/tmp/pawops-alert-heartbeat','utf8'))<180000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alert-scheduler:
    <<: *application
    restart: unless-stopped
    command: ["node", "server/jobs/alert-scheduler.js", "--loop"]
    environment:
      <<: *application-environment
      SCHEDULER_HEARTBEAT_FILE: /tmp/pawops-alert-scheduler-heartbeat
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');try{process.exit(Date.now()-Number(fs.readFileSync('/tmp/pawops-alert-scheduler-heartbeat','utf8'))<180000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
  uploads:

